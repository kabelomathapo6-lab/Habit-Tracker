<!DOCTYPE html>
<html lang="en">


<head>
  <meta charset="UTF-8" />


  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>My Habit Tracker</title>

  <style>

  
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

  
    body {
      font-family: Arial, sans-serif; 
      background-color: #f0f2f5;      
      color: #333;                   
      padding: 20px;                 
    }

    h1 {
      text-align: center;
      margin-bottom: 24px;
      font-size: 2rem;
      color: #2c3e50;
    }


    #summary {
      background-color: #2c3e50;   
      color: white;
      padding: 16px 24px;
      border-radius: 10px;         
      display: flex;              
      gap: 24px;                  
      flex-wrap: wrap;            
      margin-bottom: 24px;
    }

    .summary-item {
      display: flex;
      flex-direction: column;      
      align-items: center;
    }

    .summary-item span:first-child {
      font-size: 2rem;
      font-weight: bold;
    }

    .summary-item span:last-child {
      font-size: 0.85rem;
      opacity: 0.8;               
    }

  
    #habit-form-container {
      background-color: white;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); 
      margin-bottom: 24px;
    }

    #habit-form-container h2 {
      margin-bottom: 16px;
      color: #2c3e50;
      font-size: 1.2rem;
    }


    .form-row {
      display: flex;
      flex-direction: column;   
      margin-bottom: 14px;
    }

  
    .form-row label {
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 0.95rem;
      color: #555;
    }

   
    .form-row input,
    .form-row select {
      padding: 10px 12px;
      border: 2px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;             
      transition: border-color 0.2s; 
    }


    .form-row input:focus,
    .form-row select:focus {
      border-color: #3498db;
    }

   
    #error-message {
      display: none;              
      color: #e74c3c;            
      background-color: #fdecea; 
      border: 1px solid #e74c3c;
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 14px;
      font-size: 0.95rem;
    }

  
    #submit-btn {
      background-color: #27ae60;   
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;             
      width: 100%;                 
      transition: background-color 0.2s;
    }

    #submit-btn:hover {
      background-color: #219150;   
    }

  
    #habits-section h2 {
      color: #2c3e50;
      margin-bottom: 16px;
      font-size: 1.2rem;
    }

  
    #empty-message {
      text-align: center;
      color: #999;
      font-size: 1rem;
      padding: 40px 0;
    }

   
    .habit-card {
      background-color: white;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      gap: 16px;
      transition: opacity 0.2s;  
    }

  
    .habit-card.done {
      opacity: 0.55;             
    }

    .habit-card.done .habit-name {
      text-decoration: line-through; 
      color: #999;
    }


    .habit-checkbox {
      width: 22px;
      height: 22px;
      cursor: pointer;
      accent-color: #27ae60;     
      flex-shrink: 0;            
    }

  
    .habit-info {
      flex: 1;              
    }

    .habit-name {
      font-size: 1.05rem;
      font-weight: bold;
      color: #2c3e50;
    }

    .habit-meta {
      font-size: 0.85rem;
      color: #777;
      margin-top: 4px;
    }

   
    .habit-streak {
      background-color: #fff3cd;  
      color: #856404;            
      padding: 4px 10px;
      border-radius: 20px;       
      font-size: 0.85rem;
      font-weight: bold;
      white-space: nowrap;       
    }

    .delete-btn {
      background-color: #e74c3c;  
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background-color 0.2s;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      background-color: #c0392b;  
    }

    .category-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      margin-left: 6px;
      color: white;
    }

    
    .badge-health    { background-color: #27ae60; }
    .badge-fitness   { background-color: #e67e22; }
    .badge-learning  { background-color: #3498db; }
    .badge-mindset   { background-color: #9b59b6; }
    .badge-other     { background-color: #7f8c8d; }

  </style>
</head>

<body>

 
  <h1>📋 My Habit Tracker</h1>


  <div id="summary">
    <div class="summary-item">
      <span id="total-count">0</span>
      <span>Total Habits</span>
    </div>
    <div class="summary-item">
      <span id="done-count">0</span>
      <span>Done Today</span>
    </div>
    <div class="summary-item">
      <span id="percent-done">0%</span>
      <span>Completion</span>
    </div>
  </div>

 
  <div id="habit-form-container">
    <h2>➕ Add a New Habit</h2>

    
    <div id="error-message"></div>

    <form id="habit-form">

    
      <div class="form-row">
        <label for="habit-name">Habit Name</label>
        <input
          type="text"
          id="habit-name"
          placeholder="e.g. Drink 8 glasses of water"
        />
      </div>

      <div class="form-row">
        <label for="habit-target">Target (days per week)</label>
        <input
          type="number"
          id="habit-target"
          placeholder="Enter a number from 1 to 7"
          min="1"
          max="7"
        />
      </div>

      <div class="form-row">
        <label for="habit-category">Category</label>
        <select id="habit-category">
          <option value="">-- Select a category --</option>
          <option value="health">Health</option>
          <option value="fitness">Fitness</option>
          <option value="learning">Learning</option>
          <option value="mindset">Mindset</option>
          <option value="other">Other</option>
        </select>
      </div>

      <button type="submit" id="submit-btn">Add Habit</button>

    </form>
  </div>

  
  <div id="habits-section">
    <h2>📌 Your Habits</h2>
    <div id="habit-list">
    </div>
  </div>


 
  <script>

  

    let habits = []; // starts as an empty list — no habits yet

  
    let nextId = 1;
  

    const form          = document.getElementById('habit-form');
    const nameInput     = document.getElementById('habit-name');
    const targetInput   = document.getElementById('habit-target');
    const categoryInput = document.getElementById('habit-category');
    const errorBox      = document.getElementById('error-message');
    const habitList     = document.getElementById('habit-list');




    function validateForm() {

      const name     = nameInput.value.trim();
      const target   = Number(targetInput.value); 
      const category = categoryInput.value;

      if (name.length < 3) {
        showError('Habit name must be at least 3 characters long.');
        return false;  
      }

    
      if (!Number.isInteger(target) || target < 1 || target > 7) {
        showError('Target must be a whole number between 1 and 7.');
        return false;
      }

      
      if (category === '') {
        showError('Please select a category.');
        return false;
      }

      
      hideError(); 
      return true; 
    }


  

    function showError(message) {
      errorBox.textContent = message; 
      errorBox.style.display = 'block'; 
    }

    function hideError() {
      errorBox.textContent = '';
      errorBox.style.display = 'none'; 
    }



    function addHabit() {

    
      const name     = nameInput.value.trim();
      const target   = Number(targetInput.value);
      const category = categoryInput.value;

      
      const newHabit = {
        id:        nextId,    
        name:      name,      
        category:  category,  
        target:    target,   
        streak:    0,         
        doneToday: false      
      };

      
      habits.push(newHabit);

      
      nextId = nextId + 1;

     
      nameInput.value     = '';
      targetInput.value   = '';
      categoryInput.value = '';

      
      renderHabits();
      updateSummary();
    }




    function deleteHabit(id) {

      
      habits = habits.filter(function(habit) {
        return habit.id !== id;
      });

      
      renderHabits();
      updateSummary();
    }


  
    function toggleDone(id) {

    
      habits.forEach(function(habit) {

        if (habit.id === id) {
          
          habit.doneToday = !habit.doneToday;

        
          if (habit.doneToday === true) {
            
            habit.streak = habit.streak + 1;
          } else {
            
            habit.streak = habit.streak - 1;
            if (habit.streak < 0) {
              habit.streak = 0;
            }
          }
        }

      });

      
      renderHabits();
      updateSummary();
    }


   

    function getCategoryBadgeClass(category) {
      const classes = {
        health:   'badge-health',
        fitness:  'badge-fitness',
        learning: 'badge-learning',
        mindset:  'badge-mindset',
        other:    'badge-other'
      };
      return classes[category] || 'badge-other';
    }




    function renderHabits() {

    
      habitList.innerHTML = '';

      if (habits.length === 0) {
        habitList.innerHTML = '<p id="empty-message">No habits yet. Add one above! 🌱</p>';
        return; 
      }

     
      habits.forEach(function(habit) {

      
        const card = document.createElement('div');
        card.classList.add('habit-card');

        if (habit.doneToday) {
          card.classList.add('done');
        }


        const checkbox = document.createElement('input');
        checkbox.type    = 'checkbox';
        checkbox.checked = habit.doneToday; 
        checkbox.classList.add('habit-checkbox');

        checkbox.addEventListener('change', function() {
          toggleDone(habit.id);
        });


        const info = document.createElement('div');
        info.classList.add('habit-info');


        const badgeClass = getCategoryBadgeClass(habit.category);

        info.innerHTML =
          '<div class="habit-name">' +
            habit.name +
            '<span class="category-badge ' + badgeClass + '">' +
              habit.category +
            '</span>' +
          '</div>' +
          '<div class="habit-meta">Target: ' + habit.target + ' days/week</div>';


        const streak = document.createElement('div');
        streak.classList.add('habit-streak');
        streak.textContent = '🔥 ' + habit.streak + ' day streak';


        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = 'Delete';
        deleteBtn.classList.add('delete-btn');


        deleteBtn.addEventListener('click', function() {
          deleteHabit(habit.id);
        });


        card.appendChild(checkbox);
        card.appendChild(info);
        card.appendChild(streak);
        card.appendChild(deleteBtn);

        habitList.appendChild(card);

      }); 

    } 


    function updateSummary() {


      const total = habits.length;


      const doneHabits = habits.filter(function(habit) {
        return habit.doneToday === true;
      });
      const done = doneHabits.length;


      let percent = 0;
      if (total > 0) {
        percent = Math.round((done / total) * 100);
      }


      document.getElementById('total-count').textContent  = total;
      document.getElementById('done-count').textContent   = done;
      document.getElementById('percent-done').textContent = percent + '%';
    }

    form.addEventListener('submit', function(event) {
      event.preventDefault(); 


      if (validateForm()) {
        addHabit();
      }
    });

    renderHabits();
    updateSummary();

  </script>

</body>
</html>
